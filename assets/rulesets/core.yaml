# core.yaml — минимальный рулсет (стиль OpenXcom Extended: контент = данные, не код).

grid:
  width: 24
  height: 16

# Предметы. Порядок записей = индекс, который лежит в кучах, в лапах котов и в
# ценах тайлов. Лом валяется повсюду, а деталь до «Материаловедения» взять негде:
# её источники — разбор стартовой базы и вылазки, а мастерская открывается
# только наукой (§12.21, §12.30). Образец не идёт
# ни в одну постройку: он расходуется только наукой (§12.26), и это его
# единственное применение — привезти с вылазки и разобрать в лаборатории.
#
# force — сколько силы предмет добавляет отряду, если надет (§12.29). Больше
# нуля = это снаряжение, и оно попадает в шаблон (`loadout`). Отдельной сущности
# у снаряжения нет: комбинезон лежит в кучах, ездит в лапах и хранится на складе
# ровно как лом, и отличается только тем, что его можно надеть.
# nutrition — сколько сытости даёт одна съеденная штука (§12.36). Тот же
# переключатель-свойство: еда — это предмет с числом, а не кухня-тайл. Паёк
# закрывает голод целиком, поэтому кот ходит за ним разом, а не подъедает.
items:
  - { id: scrap,  label: "Лом",         color: "#c9a227" }
  - { id: part,   label: "Деталь",      color: "#7fb0d6" }
  - { id: sample, label: "Образец",     color: "#7fd6a0" }
  - { id: suit,   label: "Комбинезон",  color: "#d6907f", force: 1 }
  - { id: ration, label: "Паёк",        color: "#c96f4a", nutrition: 72000 }
  # mends — сколько заживления за тик добавляет израсходованная аптечка (§12.47).
  # Тот же переключатель-свойство, что force и nutrition: аптечка лежит в кучах и
  # на складе обычным ломом, а значит она **ускоряет лечение, а не открывает
  # его** — без неё раненый встанет, просто позже.
  #
  # 8 — это примерно удвоение: на койке лазарета с дошедшим медиком ставка
  # 6 (heal) + 2 (медик) = 8, с аптечкой 16. Рана в 1800 очков заживает за 225
  # тиков вместо 113 — то есть половина суток против четверти.
  - { id: medkit, label: "Аптечка",     color: "#d64a5a", mends: 80 }

# Палитра тайлов для постройки. Порядок = индекс, который отдаётся рендеру и
# приходит обратно в командах постройки. Пустые (непостроенные) клетки непроходимы —
# ходить можно только по построенному полу, поэтому нужны коридоры.
#
# cost — набор `{ предмет: сколько }`, который надо завезти на площадку до начала
# работ; снос возвращает его целиком. Пусто = бесплатно. Простой пол обходится
# ломом, а всё особенное требует ещё и детали: чтобы построить лабораторию,
# придётся решить, что снести.
# capacity — сколько штук хранит клетка, любых типов вперемешку. Больше нуля =
# это склад: коты сами свозят туда всё, что валяется на полу.
# rest — сколько бодрости кот восстанавливает здесь за тик. Больше нуля = лежанка.
# heal — сколько здоровья кот восстанавливает здесь за тик. Больше нуля = койка
# лазарета: раненые ложатся сюда сами (§12.37). Близнец `rest` и правило то же —
# заживать можно где угодно, лазарет лишь быстрее.
# gate — шлюз: отсюда отряд уходит на вылазку и сюда же возвращается с добычей.
# teaches — парта: какому навыку учит клетка. Кот сидит за ней и получает опыт
# вместо построенного тайла — так заводится домен, работы по которому ещё нет.
# lab — лаборатория: здесь идёт работа над темой исследования.
# shop — мастерская: здесь идёт работа над заказом (§12.30).
# solid — заставлено доверху: пройти клетку можно, остаться на ней нельзя
# (§12.35). Кот, которому тут нечего делать, сходит на соседнюю сам.
# lot — сколько штук влезает в один контейнер торгового поста (§12.90). Это
# предел **объёма** одной сделки: без него пост считал бы только число сделок,
# и автопродажа увозила бы весь склад через единственную ячейку — второй пост
# был бы не нужен. Ноль = без предела.
# tech — технология, без которой тайл не построить. Пусто = доступен сразу.
# Это вторые ворота прогрессии после известности: та открывает вылазки и котов,
# эта — саму базу, и открывается только своей же наукой.
tiles:
  - { id: floor,   label: "Пол",         color: "#1b2a3f", cost: { scrap: 1 } }
  - { id: storage, label: "Склад",       color: "#26506e", cost: { scrap: 2, part: 1 }, capacity: 20 }
  - { id: lab,     label: "Лаборатория", color: "#5a3a6e", cost: { scrap: 2, part: 2 }, lab: true }
  - { id: garage,  label: "Гараж",       color: "#6e5a26", cost: { scrap: 2, part: 1 }, gate: true }
  - { id: bed,     label: "Лежанка",     color: "#3f5a3a", cost: { scrap: 1, part: 1 }, rest: 120,    wake: 24000 }
  - { id: desk,    label: "Парта",       color: "#4a4f7a", cost: { scrap: 2, part: 1 }, teaches: science }
  - { id: rack,    label: "Стеллаж",     color: "#2f6f8e", cost: { scrap: 4, part: 3 }, capacity: 60, solid: true, tech: materials }
  - { id: nest,    label: "Гнездо",      color: "#4d7a44", cost: { scrap: 2, part: 2 }, rest: 300,    tech: comfort }
  - { id: shop,    label: "Мастерская",  color: "#8e6f2f", cost: { scrap: 3, part: 2 }, shop: true,   tech: materials }
  # Лазарет технологией не закрыт намеренно: раны приходят с первой же вылазки,
  # а наука — сильно позже, и запертая койка означала бы механику, которую
  # игрок сперва получает в лицо и только потом узнаёт (§12.37).
  - { id: ward,    label: "Лазарет",     color: "#8e4a4a", cost: { scrap: 2, part: 2 }, heal: 60 }
  # Торговый пост технологией не закрыт: это ранний мост «лишний лом → деталь»,
  # дорогой (около семи ломов за деталь против шести у мастерской) и медленный,
  # и к приходу «Материаловедения» он честно проигрывает цеху. Настоящие ворота
  # у него — деталь в цене: чтобы начать торговать, надо что-то снести (§12.44).
  # За постом никто не работает: это лицензия, а не рабочее место.
  - { id: post,    label: "Торговый пост", color: "#7a6f4a", cost: { scrap: 3, part: 2 }, trade: true, lot: 25 }
  # Узел связи — потолок одновременных вылазок (§12.59). Вторая лицензия после
  # поста: за ним никто не работает, он только считается. Технологией не закрыт
  # намеренно — иначе первая вылазка недоступна, а с ней и обязательная цель
  # «Первая вылазка» (§12.58). Настоящие ворота у него те же, что у поста:
  # деталь в цене, то есть чтобы вывести второй отряд, надо что-то снести.
  - { id: relay,   label: "Узел связи",  color: "#2f8e7a", cost: { scrap: 3, part: 2 }, relay: true, comms: 1 }

# Начальная застройка: комнаты + коридоры (связная сеть, чтобы коты могли ходить).
build:
  # центральный коридор
  - { tile: floor,   rect: [3, 7, 18, 2] }
  # комнаты
  - { tile: storage, rect: [3, 2, 5, 4] }
  - { tile: lab,     rect: [16, 2, 5, 4] }
  - { tile: garage,  rect: [3, 10, 6, 4] }
  # перемычки комната<->коридор
  - { tile: floor,   rect: [5, 6, 2, 1] }   # склад -> коридор
  - { tile: floor,   rect: [17, 6, 2, 1] }  # лаборатория -> коридор
  - { tile: floor,   rect: [5, 9, 2, 1] }   # гараж -> коридор
  # зона отдыха в углу гаража; идёт последней — перекрывает пол гаража
  - { tile: bed,     rect: [3, 13, 3, 1] }
  # рация в углу гаража: **один** узел связи, то есть одна вылазка разом
  # (§12.59). Второй — уже стройка, и это единственный способ вывести два
  # отряда. Стоит внутри гаража и перекрывает его клетку, как и лежанки.
  - { tile: relay,   rect: [3, 10, 1, 1] }
  # класс в лаборатории: две парты, за которыми учат «Науке»
  - { tile: desk,    rect: [16, 2, 2, 1] }

# Стартовый запас — кучами на складе. Сама стартовая застройка (`build`)
# бесплатна: это уже стоящая база, а не работа котов. Разобрать её при этом
# можно — снос возвращает цену тайла, и для мусорщиков это законный (и
# единственный) источник деталей.
#
# Пайки в стартовом запасе есть намеренно — в отличие от комбинезона, за которым
# надо ехать: голод включается сам и наказывает молча, поэтому игрок должен
# увидеть механику работающей раньше, чем она начнёт стоить (§12.36).
stock:
  - { at: [4, 3], item: scrap,  count: 20 }
  - { at: [6, 3], item: scrap,  count: 20 }
  - { at: [4, 5], item: scrap,  count: 20 }
  - { at: [6, 5], item: part,   count: 6 }
  - { at: [5, 4], item: ration, count: 6 }

# Навыки — домены работы, а не действия игрока: стройка и снос это один навык,
# потому что и задача у них одна. Навык растёт от самой работы: +1 очко опыта
# за каждый тик, проведённый за делом.
#
# levels — пороги опыта: сколько всего очков нужно на 1-й, 2-й, … уровень.
# Длина списка = потолок навыка. Каждый уровень даёт +1 очко работы за тик
# к базовым 10, а тайл стоит 120 очков: новичок строит за 12 тиков, мастер
# за 8. Один тайл приносит 12 опыта, то есть 1-й уровень — это два тайла,
# а 5-й — шестьдесят с лишним.
#
# «Вылазка» растёт по тому же правилу — очко за тик, только тик засчитывается
# проведённый в поле. Пороги поэтому крупнее: короткая вылазка это 240 тиков,
# то есть ровно первый уровень. Уровень прибавляет отряду единицу силы, с
# которой сравнивается сложность миссии.
# taught — до какого уровня доводит парта. Ноль (по умолчанию) = домену не
# учат вовсе: чинить базу должен уметь любой кот, и «Стройка» доступна с
# первого тика. «Науке» без парты не научиться никак — она допуск, а не
# скорость: обучение это вход в домен, мастерство — уже из домена.
#
# stat + demands — врождённый предел домена (§12.42): чем он ограничен и
# сколько параметра нужно на 2-й, 3-й, … уровень. Первого в списке нет
# намеренно: вход в домен параметром не закрывается никогда, предел мягкий
# (§12.19). Опыт выше предела не копится вовсе — рост, которого не видно, не
# существует. У «Ремесла» и «Медицины» предела нет: они и заводились как
# домены без допуска, куда вход открыт всем.
skills:
  - { id: build,   label: "Стройка", levels: [24, 72, 168, 360, 744],
      stat: stamina, demands: [3, 5, 7, 9] }
  - { id: raid,    label: "Вылазка", levels: [200, 600, 1400, 3000, 6200],
      stat: reflex,  demands: [3, 5, 7, 9] }
  - { id: science, label: "Наука",   levels: [200, 600, 1400, 3000, 6200], taught: 2,
      stat: mind,    demands: [3, 5, 7, 9] }
  # «Ремесло» дописано в конец: порядок записей — это индекс домена, и вставка
  # в середину переназначила бы навыки уже записанным котам. Кривая как у
  # «Стройки»: работа считается в очках и идёт тик за тиком, а не вылазками.
  - { id: craft,   label: "Ремесло", levels: [24, 72, 168, 360, 744] }
  # «Медицина» растёт от лечения — очко за тик у койки, а лечение длится сотнями
  # тиков, поэтому кривая крупная, как у «Вылазки» и «Науки». Парты у неё нет и
  # допуска тоже: лечить может любой кот, просто медленно (§12.37).
  - { id: medicine, label: "Медицина", levels: [200, 600, 1400, 3000, 6200] }
  # «Связь» дописана в конец по тому же правилу, что «Ремесло»: порядок записей —
  # это индекс домена. Растёт от дежурства у рации (§12.60) — очко за тик, а
  # дежурство длится всю вылазку, поэтому кривая крупная, как у «Вылазки».
  #
  # Предел от «Ума», а не от «Реакции»: к рации сажают голову. Это и есть та
  # причина, по которой связь — **отдельный домен**, а не «Вылазка»: считай её
  # по «Вылазке» — и лучшим связистом окажется лучший боец, то есть игрок
  # ослаблял бы отряд ровно тем, чем усиливает.
  - { id: relay,   label: "Связь",   levels: [200, 600, 1400, 3000, 6200],
      stat: mind,    demands: [3, 5, 7, 9] }

# Врождённые параметры (§12.19, §12.42). В отличие от навыка, даны при рождении
# и не растут ни от чего: параметр — это не вторая шкала мастерства, а предел,
# докуда мастерство дойдёт. Ровно поэтому коты остаются разными и после того,
# как бригада выработалась: опыт добирается работой, а это — нет.
#
# Шкала 1–10; пороги у всех доменов одни и те же ([3, 5, 7, 9]), потому что
# различать коты должны сами параметры, а не кривые доменов.
#
# `steps` — пороги, на которых параметр даёт **ступень**, то есть работает прямо
# сейчас, а не потолком (§12.70). Пороги те же ([3, 5, 7, 9]), потому что шкала
# у параметров одна: ступень 0…4 читается одинаково всюду, где её спрашивают.
# Пусто — параметр сегодня ничего не ускоряет и остаётся чистым потолком.
stats:
  # Ум сегодня только потолок «Науки» и «Связи»: своей роли в поле у него нет,
  # и бюджет разводит котов на учёных и полевых (§12.70).
  - { id: mind,    label: "Ум" }
  # Реакция режет опасность вылазки — по **лучшему** в отряде: один кот делает
  # вылазку возможной для остальных. Это проводник.
  #
  # Ступеней тут **две, а не четыре**, и это не экономия. Опасность делится на
  # `2 + ступень`, то есть четыре ступени дали бы трёхкратный размах — а сила
  # отряда это единицы (кот, уровень, комбинезон), и такой делитель перевесил бы
  # её целиком: заказ решал бы один кот, а не бригада. Две ступени держат
  # проводника **множителем на бригаду**: до половины опасности, и ни разу не
  # вместо неё.
  - { id: reflex,  label: "Реакция",      steps: [5, 9] }
  # Выносливость замедляет расход бодрости: кто дольше держится, тот чаще в поле.
  - { id: stamina, label: "Выносливость", steps: [3, 5, 7, 9] }

# Сколько лома кот уносит за одну ходку. Ноль = без предела. Перк «Носильщик»
# (`hauler`) удваивает: перки — это сложение кота, они даны и не растут.
carry: 4

# Сколько тиков в сутках (§12.4, §12.46). Это **подача, а не механика**: ядро о
# календаре не знает, вторая сущность времени была отвергнута ещё в §12.28, и
# число уходит наружу ровно затем, чтобы вид написал «день 12» вместо «тик 42327».
#
# Ровно `energy.max` — сутки это полный заряд кота, единственный ритм, который в
# симуляции уже есть. Проверяемое следствие: цикл «бодрствование + сон» влезает в
# сутки один раз (2700 тиков работы плюс ~225 сна), то есть кот спит раз в день,
# а не дважды и не через сутки. Держит это `the_shipped_ruleset_day_is_the_cats_cycle`.
day: 3600

# Шаблон снаряжения (§4.2, §12.29): что кот носит. Один на всех — выбирать не из
# чего, пока предмет снаряжения один. Комплект коты добирают сами и **со склада**:
# то, что валяется на полу, сперва свезут туда обычной уборкой. Стартового запаса
# комбинезонов нет намеренно — первый привозят со «Свалки», и это первый случай,
# когда добыча уходит не внутрь базы, а обратно в поле.
loadout: [suit]

# Перки выдаются котам по id в units:; здесь только подпись для интерфейса —
# что перк делает, знает код.
perks:
  - { id: hauler, label: "Носильщик" }

# Усталость (§12.20, §12.33, §12.52, §12.70). Бодрость тратится по `drain` очков
# за тик бодрствования, и ступень «Выносливости» из него вычитается: 36000 при
# базовом расходе 10 — это ровно минута работы на ×10 у среднего кота.
#
# Шкала укрупнена вдесятеро против прежней (§12.70) именно ради этого вычитания:
# на «очке за тик» ступень означала бы кратный разброс, а не 8…12 очков. Это тот
# же приём, по которому работа считается в очках, а не в тиках (инвариант 9).
# Вместе с бодростью укрупнены сытость и здоровье — все временные шкалы игры
# обязаны оставаться в одном масштабе, иначе `toll` и `harm`, стоящие соседними
# полями одной вылазки, разъедутся в единицах и однажды кто-то напишет «побольше
# чем у Свалки», получив вылазку, которая не утомляет. Ниже `tired` свободный
# кот сам уходит на лежанку (12 за тик); ниже `critical` он бросает начатое —
# 300 тиков хватает, чтобы дойти до зоны отдыха с любого конца базы. `floor` —
# восстановление там, где кот упал без лежанки, вшестеро медленнее.
#
# `floor_wake` — потолок сна на непригодном месте, и он **ниже `tired`
# намеренно** (§12.52): на полу кот только отлёживается, чтобы доползти до
# кровати, а выспаться можно лишь в ней. Это и делает зону отдыха обязательной,
# а не удобной. Потолок самой лежанки живёт у тайла (`wake: 2400`), у гнезда его
# нет вовсе — оно высыпает целиком, и в этом его вторая разница с лежанкой сверх
# скорости. Всё, что выше потолка, — дремота: кот добирает бодрость, пока базе
# нечем его занять, но лежанку не держит и поднимается по первому приказу.
#
# `max: 0` выключил бы механику целиком, `critical: 0` — второй порог,
# `floor_wake: 0` — потолки (сон везде до полной, как было до §12.52).
energy:
  max: 36000
  drain: 10
  tired: 9000
  critical: 3000
  floor: 20
  floor_wake: 6000

# Голод (§12.36). Вторая потребность, устроенная как первая, но с другой ценой:
# сытость тратится по очку за тик (и во сне тоже), ниже `hungry` свободный кот
# идёт к ближайшей куче с едой и съедает штуку на месте. Второго порога нет:
# начатое дело голод не срывает.
#
# Шкала вдвое длиннее бодрости — есть кот ходит вдвое реже, чем спать, и один
# паёк закрывает её целиком. `starve` — во сколько раз быстрее горит бодрость на
# пустой желудок: голод не убивает, он изматывает, и база без еды видна по тому,
# что вся бригада всё время спит. `max: 0` выключил бы механику целиком.
food:
  max: 72000
  hungry: 24000
  starve: 2

# Здоровье (§12.5, §12.37). Третья шкала — и единственная, которая сама не
# тикает: на базе кот не ранится ничем, здоровье роняет только провал вылазки.
# Смерти в игре нет, поэтому цена провала — котовремя: ниже `hurt` кот выбывает
# из работы, ложится лечиться и в отряд не берётся.
#
# Шкала совпадает с бодростью, чтобы числа читались рядом (§12.70: обе укрупнены
# вдесятеро разом — единицы у соседних полей одной вылазки обязаны совпадать).
# `mend: 10` — заживление без лазарета: 12000 очков ранения это 1200 тиков лёжки, то есть выбывший кот
# стоит дороже любой постройки. Койка лазарета (6 за тик) и пришедший медик
# (+2 и ещё по очку за уровень «Медицины») сокращают срок в разы — в этом весь
# смысл строить лазарет и держать кота у койки вместо стройки.
health:
  max: 36000
  hurt: 24000
  mend: 10

# Фракции (§4.4, §4.5, §12.43). Порядок записей — индекс, как у items: и stats:.
#
# Репутация — третья шкала-ворота и единственная знаковая. Известность отвечает
# «насколько высоко» и только копится; репутация отвечает «от кого» и потому
# умеет закрывать. Двигает её только выполненный заказ (провал — ничего), она
# никогда не платит, и дорога назад есть всегда.
#
# span — предел в обе стороны: дно достижимо и конечно, значит и путь назад
# измерим. Двух фракций хватает: третья добавила бы комбинаторику, а не решение;
# одиннадцать из §4.5 — это цель, а не шаг.
# Рынок (§12.44). Деньги входят только продажей и уходят только покупкой —
# напечатать их нельзя, поэтому торговля не создаёт богатства, а меняет его
# состав, и всегда с убытком.
#
# lead — тиков от заказа до поставки: у Полиции долго и дёшево (бумаги), у
# Синдиката вчетверо быстрее и заметно дороже (контрабанда). Это второе лицо
# развилки §12.43: сторону выбирают уже не только по заказам, но и по темпу.
# spread — наценка на покупку: та самая потеря, и она же защита от перевозки
# товара по кругу между фракциями.
# favor — насколько репутация двигает курс при полном доверии. Репутация при
# этом не тратится: она делает цену лучше или хуже, а не платит за товар.
# period — сколько тиков держится фаза; prices — базовый курс по фазам.
# Фазу выбирает тик, значит расписание видно вперёд и по нему можно планировать
# («успеть продать до обвала»), а не караулить пик с секундомером.
#
# ⚠️ Размах фаз и разница курсов между фракциями обязаны укладываться в спред,
# иначе появляется бесплатный доход: купить в дешёвой фазе и продать в дорогой
# либо возить товар от одних к другим. Это стережёт
# `the_shipped_ruleset_leaves_no_arbitrage` — правьте цифры только вместе с ним.
#
# Ломом торгуют обе стороны (потому и курсы у него близкие), а дальше расходятся:
# Полиция берёт образцы и продаёт детали, Синдикат берёт комбинезоны и кормит
# пайком. Чего нет в списке, тем фракция не торгует — отдельного флага не нужно.
factions:
  - id: police
    label: "Полиция"
    color: "#5f8fd6"
    span: 100
    lead: 720
    spread: 60
    favor: 10
    period: 900
    prices:
      scrap:  [5, 6, 5]
      sample: [22, 20, 24]
      part:   [30, 28, 32]
  - id: syndicate
    label: "Синдикат"
    color: "#a05fd6"
    span: 100
    lead: 240
    spread: 90
    favor: 10
    period: 900
    prices:
      scrap:  [6, 5, 6]
      suit:   [26, 24, 28]
      ration: [12, 10, 12]

# Вылазки (§12.22, §12.23). Отряд игрок выбирает поимённо — единственная
# работа, где исполнитель не раздаётся симуляцией: от состава зависит исход.
#
# squad — сколько котов уходит, ticks — сколько длится (отсчёт с ухода отряда,
# 240 тиков — это 40 секунд на ×1 и 4 на ×10), loot — добыча при полном успехе.
# Вылазка — первый источник дохода базы и единственный до мастерской: пока
# «Материаловедение» не изучено, детали берутся из разбора наследства и добычи.
#
# danger сравнивается с силой отряда (по коту — 1 плюс уровень «Вылазки»):
# хватило — вся добыча, не хватило — её доля, вдвое меньше нужного — провал
# (ни добычи, ни сил). Броска кубика нет: выбор отряда должен читаться.
# toll — во сколько бодрости вылазка обходится каждому коту; провал забирает
# всю, и коты валятся прямо у шлюза.
# harm — во сколько здоровья обходится полный провал; частичный успех ранит той
# же долей, какой недобрал добычи, а полный успех не царапает никого (§12.37).
# Это и есть цена провала, которой у вылазки не было: бодрость возвращается сама
# и даром, а выбывший кот — это сотни тиков без работника. На «Свалке» провал
# кладёт новичка в лазарет с запасом, но не насмерть: смерти в игре нет.
#
# Лестница задумана так: «Свалка» по силам новичкам (2 кота × 1 = 2), «Ангар»
# сразу даёт половину добычи и полную — когда все трое дорастут до 1-го уровня
# **или** оденутся в привезённые со «Свалки» комбинезоны (§12.29): снаряжение —
# это второй способ набрать силу, и в отличие от навыка он покупается добычей.
# «Логово» на старте гарантированно провалится и ждёт мастеров — а провал ещё и
# сдирает с отряда снаряжение, поэтому ходить туда «на опыт» дорого.
# fame — известности за полный успех (доля добычи = та же доля известности),
# requires — сколько её нужно, чтобы за дело вообще взялись. Известность только
# растёт и только открывает: платят предметами, а не ею (§12.24).
#
# rescue — вылазка за своим (§12.40): идут не за добычей, а за котом, которого
# провал оставил в плену. Заявку принимают, только пока есть кого спасать, а
# успех возвращает пленных домой. Её цифры — не сложность, а гарантия: requires
# нулевой, отряд в одного кота, danger 2 — столько, чтобы даже безнавыковый
# новичок (сила 1) не провалился, а лишь вернулся с ранами. Плен обязан быть
# обратим всегда: смерти в игре нет, и через чёрный ход ей входить незачем.
# Ни заказчика, ни пола доверия у неё нет и быть не может: своих вытаскивают при
# любой репутации, иначе рассорившаяся со всеми база теряла бы кота навсегда.
#
# patron/against/standing — заказчик, пострадавший и то, на сколько успех двигает
# репутацию: одному вверх, другому вниз, ровно настолько же (§12.43). Двумя
# полями, а не набором {фракция: сколько}, — набором можно было бы написать
# заказ, который нравится всем, то есть фракции без решения.
# needs — пол доверия, ниже которого заказ не дают. Известность решает, дорос ли
# ты вообще; это — станут ли с тобой говорить именно эти.
#
# Развилка здесь одна и намеренно несимметричная по НАГРАДЕ, а не по цене:
# «Сопровождение» и «Разбор ангара» — зеркало (тот же отряд, срок, сложность и
# 20 репутации), поэтому взятые по очереди они оставляют базу на нуле у обеих
# сторон. Сидеть на заборе можно — но с забора не видно ни одних ворот: «Логово»
# открывает Полиция, а «Гвоздя», без которого «Логово» не вытянуть, присылает
# Синдикат. Работа, которую хочешь, и кот, с которым она по силам, лежат по
# разные стороны — вот и всё решение.
missions:
  - id: junkyard
    label: "Свалка"
    # Вилка широкая, работа на месте длинная: свалку разбирают лапами, и лишний
    # кот тут честно ускоряет (§12.70). Минимум — один кот: первая ступень
    # лестницы обязана быть доступна базе, у которой на узле пока один
    # оперативник, — иначе «Вылазки» открываются не с первой рации, а со второго
    # кота на ней. Одиночка ходит долго (420 тиков против 132 впятером), и это и
    # есть цена, которую платит малый отряд.
    squad: [1, 5]
    travel: 60
    work: 360
    danger: 2
    toll: 12000
    harm: 18000
    fame: 10
    requires: 0
    loot: { scrap: 24, part: 2, sample: 2, suit: 1, ration: 3 }
  - id: convoy
    label: "Сопровождение каравана"
    squad: [3, 5]
    # Единственный заказ лестницы, где **весь срок — дорога** (§12.70, §12.71).
    # Караван идёт своим ходом, и лишние лапы его не подгоняют: работы на месте
    # нет вовсе, а отряд решает только, дойдёт ли он. Это делает вилку состава
    # осмысленной с другой стороны — брать сверх минимума стоит ради силы, а не
    # ради скорости, — и даёт игроку заказ, где «добрать котов» не универсальный
    # ответ. Ровно эту разницу и показывает вилка срока в штабе: у «Свалки»
    # 420→132, здесь 480 при любом составе.
    travel: 480
    work: 0
    danger: 6
    toll: 18000
    harm: 24000
    fame: 25
    requires: 20
    # Работа законная: платят образцами и пайком, а не тем, что плохо лежало.
    loot: { scrap: 18, part: 6, sample: 9, suit: 1, ration: 9 }
    patron: police
    against: syndicate
    standing: 20
  - id: hangar
    label: "Разбор ангара"
    squad: [3, 5]
    travel: 120
    work: 1080
    danger: 6
    toll: 18000
    harm: 24000
    fame: 25
    requires: 20
    # Зеркало «Сопровождения» во всём, кроме добычи: ломом и комбинезонами
    # платят за то, о чём не спрашивают.
    loot: { scrap: 30, part: 6, sample: 5, suit: 2, ration: 6 }
    patron: syndicate
    against: police
    standing: 20
  - id: lair
    label: "Логово рейдеров"
    # Вилка уже: в логово лишние лапы это лишний шум, а не скорость.
    squad: [2, 4]
    travel: 120
    work: 480
    # 14, а не 10, как было до §12.70: опасность теперь встречает отряд уже
    # урезанной проводником, и с прежним числом верхняя ступень лестницы
    # бралась стартовой парой с ходу. Считается так: у «Excellent» реакция 7,
    # то есть ступень 1, и логово встречает пару как 14*2/3 = 9. Силы у неё к
    # возвращению 4 (единица кота плюс уровень, набранный прямо в поле), а
    # 4*2 < 9 — провал, как и задумано. Без проводника заказ тяжелее вдвое,
    # а выросшая бригада в комбинезонах берёт его целиком.
    danger: 14
    toll: 24000
    harm: 30000
    fame: 60
    requires: 60
    loot: { scrap: 40, part: 12, sample: 10, suit: 3, ration: 10 }
    # Рейдеры безфракционны (§4.5), поэтому пострадавшего у заказа нет: он
    # поднимает Полицию, не роняя Синдикат. Дорога назад к Синдикату — это
    # «Разбор ангара», заказ, которого он не закрывает никогда.
    patron: police
    standing: 20
    needs: { police: 30 }
  - id: rescue
    label: "За своим"
    rescue: true
    # Вилки нет и быть не должно: за своим идёт один кот, и «послать побольше,
    # чтобы быстрее» тут значило бы торговать чужой свободой (§12.70).
    squad: 1
    travel: 240
    danger: 2
    toll: 18000
    harm: 26000
    fame: 5
    requires: 0

# Найм (§12.24). Коты уникальны (§4.2), поэтому это не «юниты типа X», а
# конкретные коты: каждый нанимается один раз и приходит уже умеющим — тот самый
# «навык из найма», который предсказал §12.18.
#
# requires — известность, на которую кандидат откликается; cost — чем платим со
# склада. Деталь получает второго потребителя кроме стройки, и это настоящая
# дилемма: лаборатория или новые лапы. skills — стартовый опыт, а не уровень:
# уровень выводится из опыта по порогам, второго места для него нет.
#
# stats — то, ради чего на кандидата смотрят (§12.42): опыт база доберёт и сама,
# а предел даётся раз и навсегда. Оба специалиста доходят в своём домене до
# потолка и оба середняки в остальном — найм стал выбором, а не выдачей.
#
# needs — пол доверия у фракции, которая кандидата присылает (§12.43). Только
# ворота: репутацией не платят, платит склад. «Гвоздь» — вторая половина
# развилки: ходок, без которого «Логово» не вытянуть, приходит от Синдиката,
# а само «Логово» открывает Полиция.
recruits:
  - id: nail
    label: "Гвоздь"
    sprite: cat_helper
    requires: 20
    cost: { scrap: 12, part: 3 }
    skills: { raid: 620 }
    stats: { mind: 4, reflex: 9, stamina: 6 }
    perks: [hauler]
    # Своих присылают тем, кому доверяют (§12.43). Репутация при этом не
    # тратится — платит склад: найм это покупка, а не поступок.
    needs: { syndicate: 30 }
  - id: brick
    label: "Кирпич"
    sprite: cat_helper
    requires: 45
    cost: { scrap: 20, part: 5 }
    skills: { build: 400 }
    stats: { mind: 5, reflex: 4, stamina: 9 }

# Коты стартуют в гараже (на проходимом полу) — он же шлюз.
#
# **Сумма параметров у всех одна — 18** (§12.70). Это и есть весь смысл тройки:
# кот — не ступень качества, а **форма**. По одной шкале «лучше/хуже» выбирать
# нечего: всегда бери верхнего.
#
# Формы разведены по трём вопросам, на которые параметры отвечают (§12.70):
#   * `excellent` — реакция 7: **проводник**, режет опасность вылазки всей бригаде;
#   * `sp2` — выносливость 8: дольше держится, значит чаще в поле; он же
#     «Носильщик» перком и рабочая лошадь по потолкам стройки;
#   * `sp3` — ум 8: наука до 4-го уровня, но в поле и на стройке дальше
#     второго не уйдёт. Полевой роли у ума нет намеренно — бюджет разводит котов
#     на учёных и полевых.
#
# **Имена остались прежними** — это решение игрока, а не следствие §12.70:
# «excellent» здесь читается как кличка, а не как оценка, и различает котов
# теперь бюджет, а не имя.
#
# До потолка в своём домене не дотягивает никто — это работа найма.
units:
  - { id: excellent,  sprite: cat_excellent,  pos: [4, 11],
      stats: { mind: 5, reflex: 7, stamina: 6 } }
  - { id: sp2, sprite: cat_helper, pos: [6, 11], perks: [hauler],
      stats: { mind: 5, reflex: 5, stamina: 8 } }
  - { id: sp3, sprite: cat_helper, pos: [5, 12],
      stats: { mind: 8, reflex: 4, stamina: 6 } }

# Наука (§12.26). Тема — та же разметка работы, что и чертёж: игрок выбирает,
# что изучать, а сядет за это ближайший кот, которому хватает «Науки».
#
# level — допуск по «Науке»: без уровня за тему не берутся вовсе, а не медленно.
# Первый берётся партой (200 тиков за ней), второй — партой или практикой:
# закрытая тема сама поднимает навык исполнителя.
# work — очки работы, как у тайла (120): тема на 2200 — это примерно 200 тиков
# для новичка-первоуровневого и заметно меньше для мастера.
# cost — образцы со склада, разом при заявке. Единственный их источник —
# вылазки, поэтому наука тянет за собой поле, а не заменяет его.
# requires — какие технологии нужны до: это и есть дерево.
# Ворота автоматики (§12.93): какая технология открывает какое правило игрока.
# Пусто — правило доступно с первого тика (так живут синтетические миры тестов).
#
# Плата тут не про баланс: объём автопродажи и так считается контейнерами
# (§12.90), а продаёт она по текущему курсу, теряя те 20 %, которые берёт
# игрок, дождавшийся пика. Плата — про **темп**: базой сперва управляют руками,
# осваивают её, и только потом отдают часть управления автомату.
#
# «Убирать сам» и «Беречь себя» здесь не названы намеренно: они включены с
# начала и предохранители, а не повторение решения. Без первого лом не попадает
# на склад вовсе, без второго коты валятся на пол.
automation:
  sales:    logistics    # порог автопродажи (§12.87)
  crafting: planning     # порог автопроизводства (§12.65)
  raids:    callsigns    # автовылазка (§12.67)

research:
  - id: materials
    label: "Материаловедение"
    level: 1
    work: 2200
    cost: { sample: 4 }
    # открывает «Стеллаж»: втрое вместительнее склада
  - id: comfort
    label: "Быт колонии"
    level: 2
    work: 3000
    cost: { sample: 6, part: 2 }
    requires: [materials]
    # открывает «Гнездо»: вдвое быстрее лежанки
  # Ветка самостоятельности (§12.93). Веха **сама не открывает ничего** — ни
  # тайла, ни рецепта, — и это не забытая запись: её ценность в том, что за ней
  # становятся доступны три подтемы, по одной на правило. Одно решение «отдать
  # управление», а порядок дальше выбирает игрок: какую боль убрать первой.
  # Ветка не обязательна — базу можно вести руками всю партию.
  - id: autonomy
    label: "Автоматизация"
    level: 1
    work: 1600
    cost: { sample: 3 }
  - id: logistics
    label: "Складской учёт"
    level: 1
    work: 1600
    cost: { sample: 3 }
    requires: [autonomy]
    # открывает порог автопродажи: «продавать всё, что на складе сверх N»
  - id: planning
    label: "Наряды"
    level: 1
    work: 1800
    cost: { sample: 3 }
    requires: [autonomy]
    # открывает порог автопроизводства: «держать на базе не меньше N»
  # Второй уровень намеренно: это единственное правило, которое само отправляет
  # котов в поле. Потолок парты по «Науке» равен 2, значит тема достижима.
  - id: callsigns
    label: "Позывные"
    level: 2
    work: 2200
    cost: { sample: 4 }
    requires: [autonomy]
    # открывает автовылазку: узел ходит на свой заказ сам

# Производство (§12.30). Заказ — та же разметка работы, что и чертёж: игрок
# говорит, что и сколько сделать, а к верстаку встанет ближайший свободный кот.
# Допуска по навыку здесь нет — рецепт открывает технология, «Ремесло» только
# ускоряет работу.
#
# work — очки на одну штуку (как у тайла: 120 = 12 тиков новичку).
# cost — чем платим **за штуку**, и списывается это в момент, когда за неё
# берутся: заказ на десять штук, оплаченный вперёд, заморозил бы склад под
# работу, которая начнётся через полтысячи тиков. Нет материала — заказ ждёт,
# ровно как чертёж без завезённого лома.
# gives — что выходит; ложится кучей под ноги мастеру, дальше её разносит
# обычная уборка.
#
# Все три рецепта закрыты технологиями — теми же, что открывают саму мастерскую и
# «Гнездо»: наука открывает то, что внутри базы (§12.27). «Штамповка» снимает
# конечность деталей (до неё их источник — разбор наследства и вылазки),
# «Пошив» даёт снаряжению домашний источник помимо добычи (§12.29), а «Сухпаёк»
# — единственный рецепт, за которым придут **снова** (§12.36): деталь и
# комбинезон нужны считаное число раз, а еда — всегда. Из лома он потому, что
# лом это не металл, а всё, что мусорщики принесли из руин, и съедобное там
# попадается наравне с железом.
recipes:
  - id: stamping
    label: "Штамповка деталей"
    work: 900
    cost: { scrap: 6 }
    gives: { part: 1 }
    requires: [materials]
  - id: tailoring
    label: "Пошив комбинезона"
    work: 1200
    cost: { scrap: 4, part: 1 }
    gives: { suit: 1 }
    requires: [comfort]
  - id: rations
    label: "Сухпаёк"
    work: 600
    cost: { scrap: 5 }
    gives: { ration: 1 }
    requires: [comfort]
  # Второй рецепт, за которым придут снова (§12.47): раненые будут всегда, пока
  # база ходит в поле. Закрыт «Материаловедением», а не «Комфортом», намеренно —
  # той же технологией, что открывает саму мастерскую: прятать аптечку за вторую
  # ступень значит выдавать её сильно позже первых ран.
  - id: bandaging
    label: "Перевязка"
    work: 700
    cost: { scrap: 4, part: 1 }
    gives: { medkit: 1 }
    requires: [materials]

# Записка (§4.6, §12.28). Мир идёт по расписанию, и это единственное, что
# происходит без участия игрока. Дата — номер тика: второй счётчик времени был
# бы вторым источником правды.
#
# reveal — за сколько тиков до срока проступают детали («туман предзнания»):
# заранее видны только дата и `hint`, а `detail` и `requires` приходят позже.
# requires — к каким технологиям база должна успеть. Успела — событие приносит
# (`gift` кучей на шлюз и `fame`), не успела — забирает `toll` бодрости у всех,
# кто на базе. Отняли день работы, а не забег: коты отоспятся (§12.10).
#
# Первое событие безусловно и доброе: таймлайн сперва показывает себя подарком,
# а требовать начинает со второго — иначе игрок узнаёт о механике по расплате.
timeline:
  - id: caravan
    label: "Караван мусорщиков"
    at: 1800
    reveal: 900
    hint: "Кто-то придёт к шлюзу"
    detail: "Бродячие мусорщики оставят груз у гаража и пойдут дальше"
    gift: { scrap: 30, part: 4 }
    fame: 5
  - id: cavein
    label: "Обвал в старых тоннелях"
    at: 6000
    reveal: 2400
    hint: "Перекрытия наверху не вечны"
    detail: "Без «Материаловедения» бригада разгребает завал сама"
    requires: [materials]
    fame: 20
    toll: 1800

# Цели партии — то, ради чего игрок вообще здесь (§12.58).
#
# Это **обучение, а не коллекция**: семь пунктов, каждый заставляет потрогать
# свою механику, и закрыть их все — и есть смысл PoC. Лесенки нет: все видны с
# начала и берутся в любом порядке. Награды тоже нет — шкала, которая и
# открывает, и тратится, сломала бы §12.24.
#
# label — название достижения, остаётся навсегда; hint — что надо сделать,
# гаснет при взятии. Путать их нельзя: «аптечка есть на базе» превратилось бы в
# галочку, которая врёт ровно тогда, когда аптечку израсходовали.
#
# Способ достижения здесь не описан **намеренно**: цель называет результат, а
# дорогу к нему игрок ищет сам.
#
# Два условия — журнальные (`raid`, `craft`), и это не украшение: «аптечка есть
# на базе» засчиталась бы покупкой на рынке, а смысл цели — в мастерской.
# «Заработать продажей» по той же причине меряется `earned`, а не деньгами:
# деньги расходуемы, и продавший сотню да потративший её игрок цели бы не увидел.
#
# Найм намеренно спрашивает **любого** новичка, а не Гвоздя: Гвоздь приходит от
# Синдиката, «Логово» открывает Полиция, и обязательная цель на конкретного
# кандидата сделала бы одну сторону развилки единственно верной (§12.43).
goals:
  # Лежанка на эту роль не годится: стартовая застройка её уже содержит, и цель
  # закрывалась бы на первом тике (поймано `the_shipped_ruleset_starts_with_...`).
  # Лазарет же на старте отсутствует, технологией не закрыт и стоит детали —
  # то есть заставляет что-то снести, а это и есть первый настоящий выбор.
  - id: infirmary
    label: "Койка для раненых"
    hint: "построить лазарет"
    tile: ward
  - id: pantry
    label: "Кладовая"
    hint: "набрать 100 лома на складе"
    stored: { scrap: 100 }
  - id: first_raid
    label: "Первая вылазка"
    hint: "вернуться из-за периметра с добычей"
    raid: junkyard
  - id: newcomer
    label: "Пополнение"
    hint: "взять на базу нового кота"
    cats: 4
  - id: own_science
    label: "Своя наука"
    hint: "довести до конца исследование"
    tech: materials
  - id: first_medkit
    label: "Первая аптечка"
    hint: "собрать аптечку в мастерской"
    craft: bandaging
  - id: merchant
    label: "Купец"
    hint: "заработать 50 котоденег продажей"
    earned: 50

  # Скрытая: не видна, пока не взята, в счёт не идёт и финал не держит.
  # Требовать её нельзя — плен случается только от провала вылазки, и
  # обязательная цель заставляла бы игрока намеренно проиграть (§12.40).
  # Партия проходится вчистую, если никто в плен не попал, и это правильный
  # исход, а не пропущенный контент.
  - id: no_one_left
    label: "Своих не бросаем"
    hint: "вернуть кота из плена"
    raid: rescue
    hidden: true
