  # Ачивка со сроком (§12.158) — **вызов на самопроверку**, а не программа
  # партии: видна с начала, но в счёт «Цели N/7» не идёт и финал не держит.
  # Промах по сроку не отнимает ничего: не успел — просто не получил.
  #
  # Обязательной такая цель быть не может (сторож
  # `the_shipped_ruleset_only_dates_optional_goals`): просроченная, она заперла
  # бы финал навсегда, то есть ввела бы проигрыш по времени, которого в игре нет
  # ни одного (§12.5, §12.37, §12.40).
  #
  # Репутация названа у **обеих** сторон намеренно. Одной стороной цель выбрала
  # бы развилку за игрока (§12.43) — ровно то, что запрещено обязательным целям;
  # обеими она требует пройти развилку насквозь: подняться у одних, уйти в минус,
  # вернуться. Дорога для этого есть — «Логово рейдеров» поднимает Полицию, не
  # роняя Синдикат, — и стоит она времени, которого срок и отмеряет.
  #
  # Срок — 30 суток, посчитанные руками: 30 × `day` (3600). В тиках, потому что
  # о сутках ядро не знает, их разворачивает панель (§12.46).
  - id: month_of_plenty
    label: "Месяц изобилия"
    hint: "собрать всех котов, набрать по 1000 лома, деталей и образцов, 10 000 котоденег и дойти до 100 у обеих сторон"
    optional: true
    before: 108000
    # Все девять: три стартовых плюс шесть кандидатов. Условие держится на той же
    # развилке, что и репутация ниже, — Гвоздя и Заклёпку присылает Синдикат, Йода
    # и Антенну Полиция, — то есть «нанять всех» и «дойти до 100 у обеих» это одно
    # требование, сказанное дважды с разных сторон. Сторож
    # `the_shipped_ruleset_never_asks_for_more_cats_than_exist` держит число.
    cats: 9
    # Казна **сейчас**, а не заработанное за партию (§12.159): «изобилие» — это
    # то, что у базы в руках. Условие спорит с соседями по связке намеренно —
    # нанять всех котов и набрать склад стоит денег, — и этим оно не повторяет
    # цель «Купец», которая меряет журнал `earned` и ничего не расходует.
    money: 10000
    stored:   { scrap: 1000, part: 1000, sample: 1000 }
    standing: { police: 100, syndicate: 100 }

  # Скрытая: не видна, пока не взята, в счёт не идёт и финал не держит.
  # Требовать её нельзя — плен случается только от провала вылазки, и
  # обязательная цель заставляла бы игрока намеренно проиграть (§12.40).
  # Партия проходится вчистую, если никто в плен не попал, и это правильный
  # исход, а не пропущенный контент.
  - id: no_one_left
    label: "Своих не бросаем"
    hint: "вернуть кота из плена"
    raid: rescue
    hidden: true
