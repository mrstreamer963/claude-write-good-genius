<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SP / Эсперы — POC</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <span class="title">SP / Эсперы — <em>walking skeleton</em></span>
      <!-- Счётчик кадров и тиков: FPS меряется по rAF, TPS — по смене
           `snap.tick`, то есть по тому же сигналу, каким живёт вид. -->
      <span
        class="clock perf"
        id="perf"
        data-tip="кадров в секунду · тиков симуляции в секунду"
      ></span>
      <span class="spacer"></span>
      <span class="clock" id="scrap"></span>
      <span class="clock">день <b id="tick">0</b></span>
      <!-- Цель партии обязана быть на виду: она и есть ответ на «зачем я это
           делаю» (§12.58). Список разворачивается панелью справа. -->
      <button
        class="clock goals-toggle"
        id="goals-toggle"
        data-tip="Цели партии"
      ></button>
      <div class="speeds">
        <button class="speed" data-speed="0" data-tip="Пауза (пробел)">
          ⏸
        </button>
        <button class="speed" data-speed="1" data-tip="×1 (клавиша 1)">
          ×1
        </button>
        <button class="speed" data-speed="5" data-tip="×5 (клавиша 2)">
          ×5
        </button>
        <button class="speed" data-speed="10" data-tip="×10 (клавиша 3)">
          ×10
        </button>
      </div>
    </header>
    <!-- Плашка активного режима разметки (§12.62). Инструмент липкий: выбрав
         «Стереть», игрок остаётся в нём и после мазка, — и, забыв переключиться,
         сносит то, что хотел лишь осмотреть. Плашка держит режим на виду, у
         самой карты, а не в узком тулбаре сбоку. В курсоре её нет вовсе. -->
    <main id="stage"><div id="mode-banner"></div></main>
    <aside id="toolbar"></aside>
    <!-- Правая колонка: всё «читать». Панели складываются потоком, а не по
         фиксированным отступам, — иначе каждая новая механика двигала бы
         координаты всех соседних. -->
    <div id="side">
      <!-- Лента тикеров стоит **первой и отдельно от «Торговли»** (§12.100):
           панели ниже появляются и исчезают сами (заказы, сделки, миссия), и
           лента, стоявшая среди них, ездила по экрану под курсором — второй
           клик по «Продать» промахивался. Наверху над ней ничего не всплывает,
           значит кнопка стоит там же, где её нажали в прошлый раз. -->
      <aside id="tickers" hidden></aside>
      <aside id="goals" hidden></aside>
      <aside id="cat" hidden></aside>
      <aside id="cell" hidden></aside>
      <aside id="mission" hidden></aside>
      <aside id="captive" hidden></aside>
      <aside id="research" hidden></aside>
      <aside id="craft" hidden></aside>
      <aside id="deal" hidden></aside>
      <aside id="note" hidden></aside>
    </div>
    <!-- Уведомления о взятых целях: складываются стопкой и гаснут сами по
         **реальным** секундам, а не по тикам (§12.58) — на ×10 отмеренное
         тиками мигнуло бы и пропало. Кликов мимо них не бывает: колонка сквозная,
         ловят их только сами уведомления. -->
    <div id="toasts"></div>
    <!-- Лента новостей (§12.120): что открылось и что закрылось. Стопка, а не
         одна строка: события идут пачками (изученная тема открывает сразу
         несколько), и «показываем последнее» потеряло бы остальные. Гаснут по
         **тикам**, а не по секундам, — на паузе мир стоит, значит и стопка
         стоит, и разобрать её можно неспеша. Сквозная для мыши, как #toasts. -->
    <div id="news"></div>
    <!-- Живая подсказка (§12.107): нативный `title` браузер рисует один раз, в
         момент показа, — запись в атрибут открытую подсказку не перерисовывает,
         и висящая над числом, которое тикает каждый кадр, она врёт. Этот узел
         переписывается, пока висит. Сквозной для мыши: подсказка стоит под
         курсором и не смеет ловить клики. -->
    <div id="livetip" hidden></div>
    <!-- Финал: все обязательные цели закрыты (§12.58). Модальный экран, и он
         **не кончает партию** — закрыл и играешь дальше.
         Это не спорит с §10 («открытая песочница»): там речь о финальном акте
         Воланда, а здесь кончилось обучение, как у записки кончилось
         предзнание, а не мир (§12.46). -->
    <div id="finale" hidden></div>
    <!-- Штаб вылазок (§12.71): состав отряда и список заказов рядом, в одном
         окне. Тулбар шириной 190px не мог показать ни добычу целиком, ни цену
         решения, а состав правился в панели рации — то есть в другом месте
         экрана, чем прогноз, который от него зависит. Здесь оба ответа стоят
         рядом, и переключение кота сразу видно числом. -->
    <div id="raidwin" hidden></div>
    <!-- Склад (§12.100): всё имущество базы, курсы всех сторон и оба порога в
         одной таблице. Тулбар шириной 190px такую строку не держит — тот же
         упор, из-за которого штабом стало окно (§12.71).
         ⚠️ Но идиома у этих двух окон **противоположная**: штаб
         перерисовывается целиком каждым снапшотом, а склад строится один раз
         при открытии и дальше синхронизируется на месте. Иначе поля порогов
         молча перестают работать (§12.84, §12.87, §12.89, §12.92). -->
    <div id="stockwin" hidden></div>
    <!-- Реестры-окна (§12.118): список, из которого выбирают одно из многих,
         не помещается в колонку тулбара. Вход — кнопка тулбара, не карта (§12.101). -->
    <div id="sciwin" hidden></div>
    <div id="hirewin" hidden></div>
    <!-- Витрина внешнего рынка (§12.150). Своё окно, а не строка «Склада»:
         ассортимент приходит **от прайса фракции**, а не от имущества базы, и
         в нём стоит то, чего база не видела ни разу, — то есть ровно то, что
         §12.131 из «Склада» прячет. Покупка ни к чему на базе не обращена, и
         это та же граница адресности, по которой §12.119 разводит окно и
         раздел тулбара. -->
    <div id="buywin" hidden></div>
    <!-- Что держать в ящике (§12.195). Единственное окно, чья дверь стоит **в
         панели клетки**, а не в тулбаре, — потому что решение адресно клетке
         (§12.119). §12.101 при этом цел: модал открывает не клик по карте, а
         отдельная кнопка в уже открытой карточке, то есть второй осознанный
         жест. Список — строкой на предмет: имена сканируются, а сетка из двух
         десятков незнакомых глифов нет. -->
    <div id="binwin" hidden></div>
    <!-- Личное дело (§12.N). Окно про **конкретного кота** — то есть исключение
         из §12.119, где адресное живёт у самого адресата. Работает оно потому,
         что кота выбирают не с карты, а вкладкой внутри окна: дословно то, что
         §12.166 сделала с гаражами, отдав выбор узла вкладкам штаба. §12.101
         цел — обе двери (кнопка в панели кота и пункт тулбара) стоят вне карты.
         Идиома складская (§12.118): строится один раз при открытии, дальше
         синхронизируется на месте — иначе прокрутка отматывается, а кнопка
         «Учить» молча перестаёт нажиматься. -->
    <div id="dossier" hidden></div>
    <!-- Справочник (§12.204). Восьмое окно и единственное, которое ничего не
         решает: в нём только лор и перекличка палитр, кнопок команд нет ни
         одной. Отсюда и его особенность — оно **возвращает** туда, откуда его
         открыли: игрок жмёт «?» у строки склада, читает и ждёт увидеть склад
         обратно, а не пустую карту. Прочие окна взаимоисключающи и друг друга
         не помнят (`closeOtherWindows`), потому что каждое из них — цель
         похода, а справочник — сноска посреди него. -->
    <div id="wikiwin" hidden></div>
    <div id="error" hidden></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
