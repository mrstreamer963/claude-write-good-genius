[package]
name = "sp_sim"
version = "0.1.0"
edition = "2024"
description = "SP / Эсперы — simulation core (bevy_ecs -> WASM)"
license = "MIT"
repository = "https://github.com/Islands-of-Eternal-Cats/cats-of-base"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[dependencies.bevy_ecs]
version = "0.19"
default-features = false

# Сторож снимка (`every_component_is_either_saved_or_skipped`) сверяет реестр
# компонентов по именам типов, а `DebugName` хранит имя только с этой фичей.
# Dev-зависимость включает её лишь в тестовых сборках — wasm от неё не растёт.
[dev-dependencies.bevy_utils]
version = "0.19"
default-features = false
features = ["debug"]

[profile.release]
opt-level = "s"
