[package]
name = "sp_sim"
version = "0.1.0"
edition = "2024"
description = "SP / Эсперы — simulation core (bevy_ecs -> WASM)"
license = "MIT"
repository = "https://github.com/mrstreamer963/claude-write-good-genius"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# bevy_ecs тянет getrandom транзитивно; на wasm нужен бэкенд wasm_js
# (плюс cfg-флаг в .cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[dependencies.bevy_ecs]
version = "0.15"
default-features = false

[profile.release]
opt-level = "s"
